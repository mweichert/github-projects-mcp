[project]
name = "mcp-github-projects"
version = "0.3.0"
description = "MCP Server for interacting with GitHub Projects V2"
requires-python = "==3.12.8"
readme = "README.md"
license = { file = "LICENSE" }

authors = [{ name = "Hillary Kipkemoi", email = "hillaryk2k@gmail.com" }]
dependencies = ["fastmcp>=2.2.0", "httpx>=0.27.0", "PyNaCl>=1.5.0", "python-dotenv>=1.0.0"]

[project.urls]
Homepage = "https://github.com/mweichert/github-projects-mcp"
Repository = "https://github.com/mweichert/github-projects-mcp.git"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/github_projects_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
]

[project.scripts]
mcp-github-projects = "github_projects_mcp.server:main"
